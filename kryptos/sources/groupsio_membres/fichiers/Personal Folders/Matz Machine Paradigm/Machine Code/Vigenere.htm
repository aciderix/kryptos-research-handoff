            str = str + "analogue computation was poorly explained in those early papers, so this page serves as an interactive exposition of what it means in practice.  This page is fully interactive, so have fun! If you run the K1 and K2 ";

        function resetBlockToDefault(position)
        {
                ctx.fillStyle = '#5b6b83';
                ctx.fillRect(ctMatrix[position].x, ctMatrix[position].y, boxSize, boxSize);

                ctx.beginPath();
                ctx.lineWidth = "1";
                ctx.strokeStyle = '#a9a9a9';
                ctx.rect(ctMatrix[position].x, ctMatrix[position].y, boxSize, boxSize);
                ctx.stroke();

                    }

                    ptPointer = markers[sectionMarker].start;
                    currentKeywordPosition = -1;
                    lastBlock = markers[sectionMarker].end - 1;

                    return;
                }

                }

            var previousPosition = 1;

            if (ctPointer > 0) {

            }
            else

            return ctMatrix[ctPointer].t;

        function findCtCharacterInRow()
        {
            var len = tblMatrix.length;
            for (var i = 0; i < len; i++)
            {

                    tblMatrix[i].h = true;
                    ctx.fillStyle = '#ff9900';
                    ctx.fillRect(tblMatrix[i].x, tblMatrix[i].y, boxSize, boxSize);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(tblMatrix[i].t, tblMatrix[i].x + 2, tblMatrix[i].y + 12, boxSize, boxSize);
                    return tblMatrix[i].c;
                }
            }
        }

        function findLookupRow()
        {
            var len = tblMatrix.length;
            for (var i = 0; i < len; i++)
            {
                if (tblMatrix[i].c == 27 && tblMatrix[i].t == currentTblLookUpCharacter)

                    ctx.fillStyle = '#ff9900';
                    ctx.fillRect(tblMatrix[i].x, tblMatrix[i].y, boxSize, boxSize);

                    return tblMatrix[i].r;
                }
            }

                    return tblMatrix[i].t;
                }
            }
        }

        function writePlainTextToOutput()

            ctx.fillStyle = '#ffffff';

        }

        function stepFn()
        {
            

            //Step 0 Iterate the current cursor position
            ctPointer++;
            ptPointer++;
            

            //Step 1 Highlight the current CT letter under the cursoe and return its value
            currentCtCharacter = getCtCharacterUnderCursor();
            if (currentCtCharacter == " " || currentCtCharacter == "*" ||  typeof currentCtCharacter === 'undefined')
            {
                return;
            }

            if (currentCtCharacter == "?")
            {
                currentDecodeRowCharacter = currentCtCharacter;
                writePlainTextToOutput();
                return;
            }
            //Find the current letter of the keyword
            keyword = document.getElementById("keyword").value;
            if (currentKeywordPosition > keyword.length - 2)
            {
                currentKeywordPosition = 0;
            }
            else
            {
                currentKeywordPosition++;
            }
            currentTblLookUpCharacter = keyword.charAt(currentKeywordPosition);
            //Now find this letter in the lookup column of the tableau and highlight it whilst returning its row
            currentLookupRow = findLookupRow();
            //In this row find the current CT character and highlight it whilst returning its column.
            currentLookupColumn = findCtCharacterInRow();
            //Now find the plain text character in the corresponding decode row
            currentDecodeRowCharacter = findDecodeCharacter();
            //Finally Write the plaintext in the plaintext output
            writePlainTextToOutput();
            return;
         
        }

        function doK3Fn()

            //Step 0 Iterate the current cursor position
            ctPointer++;
            //ptPointer++;
            
            //Step 1 Highlight the current CT letter under the cursoe and return its value
            currentCtCharacter = getCtCharacterUnderCursor();
            if (currentCtCharacter != " " && currentCtCharacter != "*")
            {
                k3SkipCounter++;
                if (k3SkipCounter == 192)

                    ptPointer++;
                    
                    currentDecodeRowCharacter = currentCtCharacter;
                    writePlainTextToOutput();
                    if (ptPointer == columnEnds[currentK3Row])

                        currentK3Row++;
                        ptPointer = 461 + (currentK3Row * 33);
                        if (currentK3Row == 11)

                            ctx.rect(ctMatrix[818].x, ctMatrix[818].y, boxSize, boxSize);
                            ctx.stroke();

                            ctx.fillText(ctMatrix[818].t, ctMatrix[818].x + 2, ctMatrix[818].y + 12, boxSize, boxSize);
                        }
                    }
                    k3SkipCounter = 0;
                    
                }
            }
        }

        function autoFn()

            timerCtrl = setInterval(stepFn, document.getElementById("cursorTimeout").value);
            inAuto = true;
            return;
